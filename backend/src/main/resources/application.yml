server:
  port: 8080

spring:
  application:
    name: devopsflow-ai
  datasource:
    url: ${DB_URL:jdbc:h2:mem:devopsflow;MODE=MySQL;DATABASE_TO_LOWER=TRUE}
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD:}
    driver-class-name: ${DB_DRIVER:org.h2.Driver}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
  h2:
    console:
      enabled: true

app:
  jwt:
    secret: ${JWT_SECRET:devopsflow-ai-demo-secret-key-for-local-portfolio-build}
    expiration-minutes: 720
  monitoring:
    enabled: true
    interval-ms: 60000

springdoc:
  swagger-ui:
    path: /swagger-ui.html
